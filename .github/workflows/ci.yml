name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        # pyproject.toml already adds -q; a second one would hide the summary line
        run: pytest -m "not slow"
      - name: Quick experiments smoke run
        if: matrix.python-version == '3.12'
        run: python -m evroute.experiments.runner --quick -o results-ci case-studies optimality-gap

  # The tests run against the source tree; this job checks what users install:
  # the wheel must carry the web viewer, the results dashboard and the data files
  # (also the real-data network of src/evroute/data/osm_turkey).
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Install the wheel and run it outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          venv/bin/evroute plan turkey-karaman-istanbul
          venv/bin/evroute plan turkey-osm-karaman-mersin
          venv/bin/evroute viz turkey-karaman-istanbul -o viewer.html
          venv/bin/evroute experiments --quick -o r vehicles
          test -s r/results.html
