[build-system]
# 77 is the first setuptools that reads an SPDX `license` string and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evroute"
version = "1.0.0"
description = "Exact, battery-, queue- and degradation-aware route planning for electric vehicles with charging stations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mustafa Açık" }]
keywords = [
  "electric vehicles", "route planning", "charging stations", "shortest path",
  "label setting", "A*", "battery degradation", "operations research",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
# The core is pure Python on purpose: no dependency is needed to plan routes.
dependencies = []

[project.optional-dependencies]
# Every figure is drawn with seaborn (it brings matplotlib, numpy and pandas).
plot = ["seaborn>=0.13"]
dev = ["pytest>=7", "seaborn>=0.13"]

[project.urls]
Homepage = "https://github.com/Aseloth99/evroute"
Documentation = "https://github.com/Aseloth99/evroute/blob/main/docs/index.md"
Issues = "https://github.com/Aseloth99/evroute/issues"

[project.scripts]
evroute = "evroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evroute = ["viz/web/*", "viz/web/**/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running cross-validation tests"]
