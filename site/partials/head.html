<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F46E5'/%3E%3Cpath d='M18 4 8 18h7l-2 10 10-14h-7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{root}}assets/theme.css">
<link rel="stylesheet" href="{{root}}assets/site.css">
<script>
  // language and theme before the first paint (no flash); assets/site.js wires the buttons
  (function () {
    var d = document.documentElement, l = null, t = null;
    try { l = localStorage.getItem('evroute.lang'); t = localStorage.getItem('evroute.theme'); } catch (e) { /* blocked */ }
    var q = /[?&]lang=(tr|en)\b/.exec(location.search);
    if (q) l = q[1];
    if (l !== 'tr' && l !== 'en') l = /(^|,)tr/i.test((navigator.languages || [navigator.language || '']).join(',')) ? 'tr' : 'en';
    d.setAttribute('data-lang', l);
    d.setAttribute('lang', l);
    var dark = t === 'dark' || (t !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    d.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<script src="{{root}}assets/site.js" defer></script>
