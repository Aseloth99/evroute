<!--
  EVRoute results panel.  This file is a template: evroute.viz.results
  replaces the styles and scripts marker blocks below by the inlined files
  (the viewer's design tokens css/theme.css and helpers js/util.js are

<style>
/* ---- ../css/theme.css ---- */
/* ==========================================================================
   EVRoute viewer -- design tokens (light and dark theme).

   Every colour used by the HTML *and* by the canvas renderers is defined
   here; the JavaScript reads the canvas colours from these custom properties
   (EVR.util.readTheme), so a theme is changed in one place only.
   Algorithm colours are not tokens: they come with the data (Okabe-Ito
   based, one light and one dark variant per algorithm).
   ========================================================================== */

:root {
  color-scheme: light;

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --radius: 16px;
  --radius-sm: 11px;
  --radius-xs: 8px;
  --gap: 14px;
  --ease: cubic-bezier(.2, .7, .2, 1);

  /* surfaces */
  --bg: #eef1f5;
  --bg-grad: radial-gradient(1200px 600px at 10% -10%, #e4e9ff 0%, rgba(228, 233, 255, 0) 60%);
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --surface-3: #edf0f5;
  --border: #e2e7ee;
  --border-strong: #c9d1dc;
  --glass: rgba(255, 255, 255, .88);
  --glass-border: rgba(15, 23, 42, .08);

  /* text */
  --text: #0d1626;
  --text-2: #475467;
  --text-3: #667085;

  /* one accent */
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: rgba(79, 70, 229, .10);
  --accent-softer: rgba(79, 70, 229, .06);
  --accent-contrast: #ffffff;
  --focus-ring: 0 0 0 3px rgba(79, 70, 229, .38);

  /* status */
  --ok: #15803d;
  --ok-soft: rgba(22, 163, 74, .12);
  --warn: #b45309;
  --warn-soft: rgba(217, 119, 6, .13);
  --bad: #c81e1e;
  --bad-soft: rgba(220, 38, 38, .10);

  --shadow-1: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .05);
  --shadow-2: 0 2px 4px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .07);
  --shadow-3: 0 16px 40px rgba(16, 24, 40, .16), 0 3px 8px rgba(16, 24, 40, .08);

  /* time categories (charts, timeline) */
  --c-drive: #5b6b82;
  --c-queue: #f59e0b;
  --c-setup: #b4aca6;
  --c-charge: #10a37f;

  /* map */
  --map-water: #d4e2ee;
  --map-land: #f3f1ec;
  --road-casing: #b7bfca;
  --road-motorway: #ffffff;
  --road-trunk: #ffffff;
  --road-primary: #fcfcfb;
  --road-minor: #ffffff;
  --label: #1d2633;
  --label-minor: #4b5565;
  --label-halo: rgba(255, 255, 255, .94);
  --st-ac: #7c8ba1;
  --st-dc: #5b5bd6;
  --st-hpc: #a21caf;
  --st-stroke: #ffffff;
  --route-casing: rgba(255, 255, 255, .96);
  --route-dim: .30;
  --pin-a: #15803d;
  --pin-b: #c81e1e;
  --terrain-alpha: 1;

  /* charts */
  --chart-grid: #e9edf2;
  --chart-axis: #8a94a6;
  --chart-text: #5a6576;
  --elev-fill: rgba(140, 120, 100, .16);
  --elev-line: rgba(140, 120, 100, .55);
  --reserve: #c81e1e;
  --crosshair: rgba(13, 22, 38, .45);

  /* battery gauge */
  --soc-high: #16a34a;
  --soc-mid: #f59e0b;
  --soc-low: #dc2626;
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --bg: #090d15;
  --bg-grad: radial-gradient(1200px 600px at 10% -10%, #1a1f45 0%, rgba(26, 31, 69, 0) 60%);
  --surface: #111827;
  --surface-2: #151e2f;
  --surface-3: #1b2639;
  --border: #233047;
  --border-strong: #33435f;
  --glass: rgba(17, 24, 39, .86);
  --glass-border: rgba(255, 255, 255, .08);

  --text: #e8edf5;
  --text-2: #aab6c8;
  --text-3: #8b98ad;

  --accent: #8b8cf8;
  --accent-hover: #a5a6fb;
  --accent-soft: rgba(139, 140, 248, .16);
  --accent-softer: rgba(139, 140, 248, .08);
  --accent-contrast: #0b1020;
  --focus-ring: 0 0 0 3px rgba(139, 140, 248, .5);

  --ok: #4ade80;
  --ok-soft: rgba(74, 222, 128, .14);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, .14);
  --bad: #f87171;
  --bad-soft: rgba(248, 113, 113, .14);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .35);
  --shadow-3: 0 18px 44px rgba(0, 0, 0, .55), 0 3px 10px rgba(0, 0, 0, .4);

  --c-drive: #6b7b94;
  --c-queue: #fbbf24;
  --c-setup: #7d756f;
  --c-charge: #34d399;

  --map-water: #0a1220;
  --map-land: #151d2b;
  --road-casing: #0a0f18;
  --road-motorway: #6b778c;
  --road-trunk: #4f5b70;
  --road-primary: #3c475a;
  --road-minor: #343e50;
  --label: #e6ebf3;
  --label-minor: #a6b1c3;
  --label-halo: rgba(9, 13, 21, .88);
  --st-ac: #94a3b8;
  --st-dc: #8b8cf8;
  --st-hpc: #e879f9;
  --st-stroke: #0b1020;
  --route-casing: rgba(8, 12, 20, .9);
  --route-dim: .34;
  --pin-a: #22c55e;
  --pin-b: #f87171;
  --terrain-alpha: 1;

  --chart-grid: #1f2a3d;
  --chart-axis: #6f7d93;
  --chart-text: #a3afc2;
  --elev-fill: rgba(180, 160, 140, .14);
  --elev-line: rgba(200, 180, 160, .45);
  --reserve: #f87171;
  --crosshair: rgba(232, 237, 245, .45);

  --soc-high: #22c55e;
  --soc-mid: #fbbf24;
  --soc-low: #f87171;
}

@media (prefers-reduced-motion: reduce) {
  :root { --ease: linear; }
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
}

/* ---- results.css ---- */
/* ==========================================================================
   EVRoute results panel -- styles.

   The design tokens (colours, fonts, radii, shadows, light/dark) are the
   route viewer's own css/theme.css, inlined before this file; algorithm and
   case colours (--a-<name>, --case-<i>, --warm, --cold) are generated by
   evroute.viz.results from ALGORITHM_COLORS and appended after it.  Charts
   are SVG and coloured through these custom properties only, so switching
   the theme restyles every chart without a redraw.
   ========================================================================== */

:root { --maxw: 1360px; --pad: 22px; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: 64px; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  min-height: 100vh;
  font: 14px/1.5 var(--font);
  color: var(--text);
  background: var(--bg-grad), var(--bg);
  background-attachment: fixed;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3, p, figure, ul { margin: 0; }
a { color: var(--accent); }
[hidden] { display: none !important; }
svg { stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.muted { color: var(--text-3); }
.hint { color: var(--text-3); font-size: 12px; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 12px; top: -48px; z-index: 100;
  padding: 8px 12px; border-radius: 8px;
  background: var(--accent); color: var(--accent-contrast);
  font-weight: 600; text-decoration: none;
  transition: top .15s var(--ease);
}
.skip-link:focus { top: 12px; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }

/* ---------------------------------------------------------------- header */
.topbar {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 18px var(--pad) 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  flex: none; width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center;
  background: linear-gradient(140deg, #6366f1, #4338ca 60%, #312e81);
  box-shadow: 0 6px 16px rgba(79, 70, 229, .35), inset 0 1px 0 rgba(255, 255, 255, .25);
}
.brand-mark svg { width: 22px; height: 22px; fill: #fff; }
.brand-text { min-width: 0; }
.brand-text h1 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subtitle { color: var(--text-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; align-items: center; gap: 10px; flex: none; }

button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }

.seg {
  display: inline-flex; padding: 3px; gap: 2px;
  border-radius: 11px; background: var(--surface-3); border: 1px solid var(--border);
}
.seg button {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--text-2);
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
  transition: background .15s var(--ease), color .15s var(--ease), box-shadow .15s var(--ease);
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }
.seg-icons button { padding: 0 7px; }
.seg-icons svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
.seg-sm button { height: 26px; padding: 0 10px; font-size: 12px; }
.seg-scroll { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg-scroll::-webkit-scrollbar { display: none; }
.seg-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }

.btn-sm {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 11px;
  border-radius: 9px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2);
  font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap;
  box-shadow: var(--shadow-1);
  transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.btn-sm:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
.btn-sm svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
.btn-sm[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn-link { color: var(--accent); }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700; white-space: nowrap;
}
.badge svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.6; }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-bad { background: var(--bad-soft); color: var(--bad); }
.badge-muted { background: var(--surface-3); color: var(--text-3); }

/* -------------------------------------------------------------- nav bar */
.secnav {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
.secnav-track {
  max-width: var(--maxw); margin: 0 auto;
  padding: 8px var(--pad);
  display: flex; gap: 4px;
  overflow-x: auto; scrollbar-width: none;
}
.secnav-track::-webkit-scrollbar { display: none; }
.nav-pill {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 12px 0 8px; border-radius: 999px;
  border: 1px solid transparent;
  color: var(--text-2); text-decoration: none;
  font-size: 12.5px; font-weight: 600; white-space: nowrap;
  transition: background .15s var(--ease), color .15s var(--ease);
}
.nav-pill:first-child { padding-left: 12px; }
.nav-pill:hover { background: var(--surface); color: var(--text); }
.nav-pill.active { background: var(--surface); color: var(--text); border-color: var(--border); box-shadow: var(--shadow-1); }
.nav-num {
  min-width: 19px; height: 19px; padding: 0 4px; border-radius: 6px;
  display: grid; place-items: center;
  background: var(--surface-3); color: var(--text-3);
  font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.nav-pill.active .nav-num { background: var(--accent); color: var(--accent-contrast); }
.nav-pill.is-missing { opacity: .5; }
.nav-pill.is-bad .nav-num { background: var(--bad-soft); color: var(--bad); }

/* ---------------------------------------------------------------- page */
.page {
  max-width: var(--maxw); margin: 0 auto;
  padding: 18px var(--pad) 12px;
  display: flex; flex-direction: column; gap: 18px;
}
.page:focus { outline: none; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
  padding: 16px 18px;
  min-width: 0;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.card-head h2 { font-size: 14px; font-weight: 700; }
.card-lead { color: var(--text-3); font-size: 12.5px; margin-bottom: 10px; }

/* ------------------------------------------------------------ overview */
.overview { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 70px; }
.ov-top {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 28px; align-items: center;
  padding: 28px 30px;
  box-shadow: var(--shadow-2);
}
.ov-top::before {
  content: ""; position: absolute; right: -120px; top: -160px;
  width: 520px; height: 420px; border-radius: 50%;
  background: radial-gradient(closest-side, var(--accent-soft), transparent);
  pointer-events: none;
}
.ov-intro { position: relative; min-width: 0; }
.kicker { font-size: 11.5px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.ov-intro h2 { font-size: 32px; font-weight: 760; letter-spacing: -.025em; line-height: 1.12; margin: 8px 0 10px; }
.lead { color: var(--text-2); font-size: 14.5px; max-width: 62ch; }
.ov-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.ov-meta span {
  font-size: 12px; color: var(--text-2); font-weight: 600;
  padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border);
}

.hero-kpi {
  position: relative;
  display: flex; flex-direction: column; gap: 4px;
  padding: 20px 22px; border-radius: 16px;
  background: linear-gradient(155deg, var(--accent-soft), rgba(0, 0, 0, 0) 62%), var(--surface-2);
  border: 1px solid var(--border);
  color: inherit; text-decoration: none;
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease), transform .15s var(--ease);
}
.hero-kpi:hover { border-color: var(--border-strong); box-shadow: var(--shadow-2); transform: translateY(-1px); }
.hero-value { font-size: 54px; font-weight: 760; letter-spacing: -.035em; line-height: 1.04; color: var(--text); }
.kpi-label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 650; color: var(--text-2); }
.kpi-sub { font-size: 12.5px; color: var(--text-3); }
.hero-bars { margin-top: 14px; display: grid; gap: 7px; }
.hb-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 12px; }
.hb-name { font-weight: 650; color: var(--text-2); white-space: nowrap; }
.hb-track { height: 9px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.hb-track i { display: block; height: 100%; border-radius: 999px; }
.hb-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; color: var(--text-2); }
.hb-foot { font-size: 11.5px; color: var(--text-3); }
.hero-kpi.tone-bad .kpi-sub { color: var(--bad); font-weight: 650; }

.kpi-grid { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 12px; }
.kpi {
  display: flex; flex-direction: column; gap: 3px;
  padding: 14px 16px 15px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-1);
  color: inherit; text-decoration: none; min-width: 0;
  transition: transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease);
}
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--border-strong); }
.kpi-value { font-size: 25px; font-weight: 740; letter-spacing: -.02em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .kpi-sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kpi-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--text-3); }
.tone-ok .kpi-dot { background: var(--ok); }
.tone-warn .kpi-dot { background: var(--warn); }
.tone-bad .kpi-dot { background: var(--bad); }
.tone-bad .kpi-value { color: var(--bad); }

.ov-row { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.checks { list-style: none; padding: 0; display: flex; flex-direction: column; }
.checks > li {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start;
  padding: 9px 0; border-top: 1px solid var(--border);
}
.checks > li:first-child { border-top: 0; }
.ck-ico { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; margin-top: 1px; }
.ck-ico svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.8; }
.checks .ok .ck-ico { background: var(--ok-soft); color: var(--ok); }
.checks .bad .ck-ico { background: var(--bad-soft); color: var(--bad); }
.ck-text { display: flex; flex-direction: column; gap: 3px; font-size: 13px; font-weight: 600; min-width: 0; }
.ck-secs { display: flex; flex-wrap: wrap; gap: 4px; }
.ck-secs a {
  font-size: 11px; font-weight: 600; color: var(--text-3); text-decoration: none;
  padding: 0 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border);
}
.ck-secs a:hover { color: var(--accent); border-color: var(--accent-soft); }
.ck-count { font: 700 12.5px var(--mono); color: var(--text-2); padding-top: 2px; }
.checks .bad .ck-count { color: var(--bad); }
.ck-fail { grid-column: 2 / 4; font-size: 12px; color: var(--bad); }
.ck-fail ul { margin: 4px 0 0; padding-left: 18px; font-family: var(--mono); font-size: 11px; }

.runs { list-style: none; padding: 0; display: grid; gap: 0; }
.runs li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
.runs li:first-child { border-top: 0; }
.runs a { color: var(--text); text-decoration: none; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.runs a:hover { color: var(--accent); }
.run-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.runs .muted .run-dot { background: var(--border-strong); }
.runs .muted a { color: var(--text-3); }
.runs .bad .run-dot { background: var(--bad); }
.run-st { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.runs .bad .run-st { color: var(--bad); font-weight: 650; }

/* ------------------------------------------------------------ sections */
.sections { display: flex; flex-direction: column; gap: 18px; }
.sec { padding: 24px 26px 26px; scroll-margin-top: 62px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; }
.sec-title { display: flex; align-items: center; gap: 11px; min-width: 0; flex-wrap: wrap; }
.sec-num {
  font: 750 12px/1 var(--mono); color: var(--accent);
  background: var(--accent-soft); padding: 5px 7px; border-radius: 8px;
}
.sec h2 { font-size: 20px; font-weight: 720; letter-spacing: -.015em; }
.sec-time { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.sec-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.finding {
  display: flex; gap: 12px; align-items: flex-start;
  margin-top: 16px; max-width: 96ch;
  font-size: 15.5px; line-height: 1.55; font-weight: 520; color: var(--text);
}
.finding-ico {
  flex: none; width: 28px; height: 28px; border-radius: 9px; margin-top: -1px;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.finding-ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; }
.meaning { margin-top: 8px; padding-left: 40px; max-width: 110ch; color: var(--text-2); font-size: 13.5px; line-height: 1.55; }
.meaning b { color: var(--text); font-weight: 680; }
.sec-body { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sec.status-missing { padding-top: 18px; padding-bottom: 18px; background: color-mix(in srgb, var(--surface) 70%, transparent); box-shadow: none; }
.sec.status-missing .meaning { display: none; }
.sec-note {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px; border-radius: 12px;
  background: var(--surface-2); border: 1px dashed var(--border-strong); color: var(--text-2); font-size: 13px;
}
.sec-note > svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; margin-top: 1px; }
.sec-note b { color: var(--text); }
.sec-note.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.sec-note code {
  display: inline-block; margin-top: 6px; padding: 4px 8px; border-radius: 7px;
  font: 12px var(--mono); background: var(--surface); border: 1px solid var(--border); color: var(--text);
  white-space: pre-wrap; word-break: break-word;
}
.sec-empty { color: var(--text-3); font-size: 13px; }

/* ------------------------------------------------------- chart cards */
.cc-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.cc-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cc-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cc {
  display: flex; flex-direction: column; min-width: 0;
  padding: 14px 16px 12px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--border);
}
.cc.span-full { grid-column: 1 / -1; }
.cc.span-2 { grid-column: span 2; }
.cc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; min-height: 26px; }
.cc-head h3 { font-size: 13.5px; font-weight: 680; color: var(--text); }
.cc-legend { margin: 6px 0 2px; }
.cc-legend:empty { display: none; }
.sec-legend { margin: 0; }
.cc-chart { position: relative; margin-top: 6px; min-width: 0; }
.cc-foot { margin-top: 6px; font-size: 11.5px; color: var(--text-3); }

.case-bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px;
  padding-top: 16px; margin-top: 2px; border-top: 1px solid var(--border);
}
.case-head { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; font-size: 13.5px; min-width: 0; }
.case-head b { font-size: 15px; }
.case-dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.case-detail { display: flex; flex-direction: column; gap: 14px; }

/* legend */
.lg { display: flex; flex-wrap: wrap; gap: 2px 4px; }
.lg-item {
  display: inline-flex; align-items: center; gap: 7px;
  height: 26px; padding: 0 9px 0 7px; border-radius: 8px;
  border: 1px solid transparent; background: transparent;
  color: var(--text-2); font-size: 12px; font-weight: 600; white-space: nowrap;
  transition: background .12s var(--ease), opacity .12s var(--ease);
}
.lg-item:hover { background: var(--surface-2); color: var(--text); }
.lg-item[aria-pressed="false"] { opacity: .45; }
.lg-item[aria-pressed="false"] span { text-decoration: line-through; }
.lg-item.lg-static { cursor: default; }
.lg-item.lg-static:hover { background: transparent; }
.lg-item:disabled { opacity: 1; color: var(--text-2); }
.lg-key { width: 16px; height: 3px; border-radius: 2px; background: var(--c); flex: none; }
.lg-dash { background: repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 8px); }
.lg-rect { width: 10px; height: 10px; border-radius: 3px; }
.lg-dot { width: 10px; height: 10px; border-radius: 50%; }
.lg-ring { width: 10px; height: 10px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.lg-diamond { width: 8px; height: 8px; margin: 0 1px; border-radius: 1px; background: transparent; box-shadow: inset 0 0 0 2px var(--c); transform: rotate(45deg); }
.lg-band { width: 16px; height: 10px; border-radius: 2px; background: var(--c); opacity: .35; }
.lg-size { width: 20px; height: 12px; border-radius: 0; background: radial-gradient(circle at 4px 8px, var(--c) 0 2.6px, transparent 3.2px), radial-gradient(circle at 13px 6px, var(--c) 0 5.4px, transparent 6px); opacity: .85; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  display: flex; flex-direction: column; gap: 1px;
  min-width: 140px; padding: 10px 14px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
}
.chip b { font-size: 21px; font-weight: 740; letter-spacing: -.01em; }
.chip span { font-size: 12px; color: var(--text-3); }
.chip-ok b { color: var(--ok); }

/* pareto side cards */
.cc.pa-cards { padding: 0; border: 0; background: transparent; }
.pa-side { display: flex; flex-direction: column; gap: 10px; }
.pa-card { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.pa-card-head { display: flex; justify-content: space-between; align-items: baseline; }
.pa-tag { font-size: 11px; font-weight: 760; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.pa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 8px; }
.pa-grid small { display: block; font-size: 11px; color: var(--text-3); }
.pa-grid b { font-size: 15px; font-weight: 720; }
.pa-grid em { font-style: normal; font-size: 11.5px; color: var(--text-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
.pa-grid em.good { color: var(--ok); }

/* ------------------------------------------------------------ SVG charts */
.rc { position: relative; width: 100%; }
.rc-svg { display: block; overflow: visible; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
.rc-svg:focus-visible { box-shadow: none; outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.rc-grid { stroke: var(--chart-grid); stroke-width: 1; shape-rendering: crispEdges; }
.rc-grid-v { opacity: .75; }
.rc-axis { stroke: var(--chart-axis); stroke-opacity: .55; stroke-width: 1; shape-rendering: crispEdges; }
.rc-zero { stroke-opacity: .85; }
.rc-tickmark { stroke: var(--chart-axis); stroke-opacity: .5; shape-rendering: crispEdges; }
.rc-tick { fill: var(--chart-text); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
.rc-subtick { fill: var(--text-3); font-size: 10.5px; font-weight: 500; }
.rc-title { fill: var(--text-3); font-size: 11px; font-weight: 650; }
.rc-ref { stroke: var(--text-3); stroke-opacity: .7; stroke-dasharray: 3 4; shape-rendering: crispEdges; }
.rc-ref-label { fill: var(--text-3); font-size: 10.5px; font-weight: 650; }
.rc-empty { fill: var(--text-3); font-size: 13px; }
.rc-line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.rc-dash { stroke-dasharray: 6 4; stroke-linecap: butt; }
.rc-band { fill-opacity: .13; stroke: none; }
.rc-band-focus { opacity: 0; transition: opacity .15s var(--ease); }
.focus > .rc-band-focus { opacity: 1; fill-opacity: .16; }
.rc-dot { fill: var(--c); stroke: var(--surface); stroke-width: 2; }
.rc-hollow { fill: var(--surface); stroke: var(--c); stroke-width: 2; }
.rc-hidot { stroke: var(--surface); stroke-width: 2.4; }
.rc-cross { stroke: var(--crosshair); stroke-width: 1; shape-rendering: crispEdges; }
.rc-ring { fill: none; stroke: var(--text); stroke-opacity: .55; stroke-width: 1.5; }
.rc-label { fill: var(--text-2); font-size: 11.5px; font-weight: 650; }
.rc-endkey { stroke-width: 2.4; stroke-linecap: round; }
.rc-rowlabel { fill: var(--text); font-size: 12px; font-weight: 600; }
.rc-small { font-size: 11px; }
.rc-value { fill: var(--text); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rc-note { fill: var(--bad); font-size: 11.5px; font-weight: 650; }
.rc-star { fill: var(--ok); }
.rc-muted .rc-rowlabel { fill: var(--text-3); }
.rc-rowbg { fill: var(--accent-softer); opacity: 0; transition: opacity .12s var(--ease); }
.hl > .rc-rowbg { opacity: 1; }
.rc-rowline { stroke: var(--chart-grid); stroke-width: 1; shape-rendering: crispEdges; }
.rc-strand-zone { fill: var(--bad-soft); }
.rc-bad { fill: var(--bad); font-weight: 650; }
[data-k] { transition: opacity .15s var(--ease); }
.dim { opacity: .16; }
.rc-box { fill: var(--c); fill-opacity: .14; stroke: var(--c); stroke-width: 1.6; }
.rc-whisker { stroke-width: 1.5; }
.rc-median { stroke: var(--text); stroke-width: 2.4; stroke-linecap: round; }
.rc-mean { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }
.rc-obs { fill: var(--c); fill-opacity: .78; stroke: var(--surface); stroke-width: 1.2; }
.rc-obs.hl { fill-opacity: 1; stroke-width: 2; }
.rc-pt { fill: var(--c); fill-opacity: .8; stroke: var(--surface); stroke-width: 1.6; }
.rc-pt.hl, .rc-pt-mark { fill-opacity: 1; stroke-width: 2; }
.rc-pt-x { fill: var(--surface); fill-opacity: 1; stroke: var(--c); stroke-width: 2.2; }
.rc-hollow-pt { fill: var(--surface); fill-opacity: 1; stroke: var(--c); stroke-width: 2.4; }
.rc-dotplot { fill-opacity: .9; stroke-width: 1.4; }
.rc-front { fill: none; stroke-width: 1.6; stroke-opacity: .5; stroke-linejoin: round; }
.rc-dominated { fill-opacity: .05; }
.rc-diamond { fill: var(--surface); stroke-width: 2.2; }
.rc-annot { fill: var(--text-2); font-size: 11px; font-weight: 650; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.rc-annot-strong { fill: var(--text); font-weight: 720; }
.rc-bell { stroke: var(--border-strong); stroke-width: 3; stroke-linecap: round; }
.rc-zero-mark { stroke-width: 2; }

/* tooltip */
.rc-tip {
  position: absolute; left: 0; top: 0; z-index: 6;
  min-width: 170px; max-width: 320px;
  padding: 10px 12px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-3);
  pointer-events: none;
  font-size: 12px; font-variant-numeric: tabular-nums;
}
.tt-head { font-weight: 720; font-size: 12.5px; margin-bottom: 4px; }
.tt-sub { margin: -2px 0 6px; color: var(--text-3); font-size: 11.5px; }
.tt-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 1.5px 0; }
.tt-row span { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-row b { font-weight: 720; text-align: right; white-space: nowrap; }
.tt-key { width: 14px; height: 3px; border-radius: 2px; background: var(--c); justify-self: center; }
.tt-dash { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }
.tt-rect { width: 10px; height: 10px; border-radius: 3px; }
.tt-dot { width: 9px; height: 9px; border-radius: 50%; }
.tt-ring { width: 9px; height: 9px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.tt-diamond { width: 8px; height: 8px; background: transparent; box-shadow: inset 0 0 0 2px var(--c); transform: rotate(45deg); }

/* entrance animation (first render only; off with reduced motion) */
@keyframes rc-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes rc-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes rc-fade { from { opacity: 0; } to { opacity: 1; } }
.rc-enter .rc-line:not(.rc-dash) { stroke-dasharray: 1; animation: rc-draw .9s var(--ease) both; }
.rc-enter .rc-bars { transform-box: fill-box; transform-origin: left center; animation: rc-grow .7s var(--ease) both; }
.rc-enter .rc-dot, .rc-enter .rc-pt, .rc-enter .rc-obs, .rc-enter .rc-vbar, .rc-enter .rc-band, .rc-enter .rc-box { animation: rc-fade .7s var(--ease) both; }

/* ---------------------------------------------------------------- tables */
.sec-table { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.dt-name { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12.5px; font-weight: 650; }
.dt-name svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; color: var(--text-3); }
.dt-wrap { overflow: auto; max-height: 440px; border: 1px solid var(--border); border-radius: 12px; scrollbar-width: thin; }
table.dt { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; font-variant-numeric: tabular-nums; }
.dt th {
  position: sticky; top: 0; z-index: 1;
  padding: 8px 10px; text-align: left; white-space: nowrap;
  background: var(--surface-2); color: var(--text-2);
  font: 650 11px var(--mono); border-bottom: 1px solid var(--border);
}
.dt td { padding: 6px 10px; white-space: nowrap; border-bottom: 1px solid var(--border); }
.dt tbody tr:last-child td { border-bottom: 0; }
.dt tbody tr:hover { background: var(--surface-2); }
.dt .num { text-align: right; }

/* ---------------------------------------------------------------- footer */
.footer {
  max-width: var(--maxw); margin: 0 auto;
  padding: 10px var(--pad) 30px;
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  color: var(--text-3); font-size: 12px;
}
.fatal {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center; padding: 24px;
  background: var(--bg); color: var(--text); font-size: 15px; text-align: center; white-space: pre-wrap;
}

/* ----------------------------------------------------------- breakpoints */
@media (max-width: 1180px) {
  .kpi-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .cc-grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cc-grid.cols-3 > .cc.span-2 { grid-column: 1 / -1; }
  .ov-top { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .ov-row { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .cc-grid.cols-2, .cc-grid.cols-3 { grid-template-columns: minmax(0, 1fr); }
  .cc.span-2 { grid-column: auto; }
}
@media (max-width: 760px) {
  :root { --pad: 12px; }
  .topbar { flex-wrap: wrap; padding-top: 12px; gap: 10px; }
  .brand { flex: 1 1 100%; }
  .topbar-actions { flex: 1 1 100%; justify-content: space-between; }
  .btn-print span { display: none; }
  .page { gap: 14px; padding-top: 14px; }
  .sections { gap: 14px; }
  .ov-top { padding: 20px 18px; }
  .ov-top::before { right: -220px; }
  .ov-intro h2 { font-size: 25px; }
  .hero-value { font-size: 44px; }
  .hero-kpi { padding: 16px; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { padding: 12px 13px; }
  .kpi-value { font-size: 20px; }
  .kpi .kpi-sub { white-space: normal; font-size: 11.5px; }
  .sec { padding: 18px 14px 18px; }
  .sec h2 { font-size: 17.5px; }
  .finding { font-size: 14.5px; gap: 10px; }
  .meaning { padding-left: 0; font-size: 13px; }
  .cc { padding: 12px 10px 10px; border-radius: 12px; }
  .chip { min-width: 0; flex: 1 1 40%; }
  .card { padding: 14px; }
}

/* ----------------------------------------------------------------- print */
@media print {
  body { background: #fff; }
  .secnav, .topbar-actions, .sec-tools, .skip-link, .rc-tip { display: none !important; }
  .card, .cc, .kpi, .hero-kpi { box-shadow: none !important; }
  .sec, .cc, .ov-top { break-inside: avoid; }
  .sec-table:not([hidden]) .dt-wrap { max-height: none; overflow: visible; }
}

<script>
  // Resolve the theme before the first paint (no light flash in dark mode);
  // the preference is shared with the route viewer.
  (function () {
    var pref = 'auto';
    try { pref = localStorage.getItem('evroute.theme') || 'auto'; } catch (e) { /* storage blocked */ }
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>

    return `M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z`;
  }
  RC.barPath = barPath;

  /* ================================================================ lines */
  /**
   * spec: {height, aria, x: {log, label, fmt, tipFmt, domain, ticks, grid},
   *        y: {log, label, fmt, tipFmt, zero, domain, floor},
   *        series: [{key, label, color, dash, band, points: [{x, y, lo, hi, tip}]}],
   *        hidden: Set, head: (x) => string, endLabels: bool, extraRows: (x) => rows}
   */
  RC.lines = function (host, spec) {
    return RC.mount(host, {
      height: spec.height || ((w) => (w < 520 ? 250 : 300)),
      aria: spec.aria,
      draw(ctx) {
        const { svg, w, h } = ctx;
        const hidden = spec.hidden || new Set();
        const series = spec.series.filter((s) => !hidden.has(s.key) && s.points.some((p) => finite(p.y)));
        const floor = spec.y.floor;
        const yv = (v) => (spec.y.log && floor !== undefined && finite(v) && v < floor ? floor : v);
        let xs = [], ys = [];
        for (const s of series) {
          for (const p of s.points) {
            if (!finite(p.y)) continue;
            xs.push(p.x);
            ys.push(yv(p.y));
            if (s.band && finite(p.lo)) ys.push(yv(p.lo));
            if (s.band && finite(p.hi)) ys.push(yv(p.hi));
          }
        }
        if (!xs.length) {
          svg.appendChild(S('text', { class: 'rc-empty', x: w / 2, y: h / 2, 'text-anchor': 'middle', text: I.t('no_data') }));
          return;
        }
        if (spec.y.log) ys = ys.filter((v) => v > 0);
        const xlo = Math.min(...xs), xhi = Math.max(...xs);
        const ylo = Math.min(...ys), yhi = Math.max(...ys);
        const top = 30, bottom = 40;
        const y1 = h - bottom, y0 = top;
        const yAxis = makeAxis(spec.y, ylo, yhi, y1, y0, Math.max(3, Math.floor((y1 - y0) / 44)));
        const yfmt = yAxis.fmt;
        const left = Math.max(30, maxW(yAxis.ticks.map(yfmt)) + 14);
        // end labels need room on the right
        const endLabels = spec.endLabels !== false && series.length <= 6 && !ctx.narrow;
        const right = endLabels ? Math.min(150, maxW(series.map((s) => s.label), 11.5, 600) + 22) : 18;
        const x0 = left, x1 = w - right;
        const xAxis = makeAxis(spec.x, xlo, xhi, spec.x.reverse ? x1 : x0, spec.x.reverse ? x0 : x1, Math.max(3, Math.floor((x1 - x0) / 80)));
        const X = xAxis.scale, Y = yAxis.scale;
        const g = S('g', { class: 'rc-axes' });
        svg.appendChild(g);
        gridY(g, yAxis.ticks, Y, x0, x1, yfmt);
        ticksX(g, xAxis.ticks, X, y1, xAxis.fmt, spec.x.grid, y0);
        baseline(g, x0, x1, y1);
        titleY(g, spec.y.label, 2, 13);
        titleX(g, spec.x.label, x1, h - 4);
        for (const r of spec.refLines || []) {
          const y = Math.round(Y(r.y)) + 0.5;
          g.appendChild(S('line', { class: 'rc-ref', x1: x0, x2: x1, y1: y, y2: y }));
          if (r.label) g.appendChild(S('text', { class: 'rc-ref-label', x: x0 + 6, y: y - 5, text: r.label }));
        }

        const plot = S('g', { class: 'rc-plot' });
        svg.appendChild(plot);
        const clipId = `c${Math.random().toString(36).slice(2, 9)}`;
        plot.appendChild(S('clipPath', { id: clipId }, S('rect', { x: x0 - 6, y: y0 - 8, width: x1 - x0 + 12, height: y1 - y0 + 14 })));
        const markers = [];
        for (const s of series) {
          const sg = S('g', { class: 'rc-series', 'data-k': s.key, 'clip-path': `url(#${clipId})` });
          plot.appendChild(sg);
          if (s.band) {
            const up = [], dn = [];
            for (const p of s.points) {
              if (!finite(p.lo) || !finite(p.hi)) continue;
              up.push([X(p.x), Y(yv(p.hi))]);
              dn.push([X(p.x), Y(yv(p.lo))]);
            }
            if (up.length > 1) {
              const d = pathD(up) + 'L' + dn.reverse().map((q) => `${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('L') + 'Z';
              sg.appendChild(S('path', { class: `rc-band${s.band === 'focus' ? ' rc-band-focus' : ''}`, d, style: { fill: s.color } }));
            }
          }
          const pts = s.points.map((p) => (finite(p.y) ? [X(p.x), Y(yv(p.y))] : null));
          sg.appendChild(S('path', { class: `rc-line${s.dash ? ' rc-dash' : ''}`, d: pathD(pts), pathLength: s.dash ? null : '1', style: { stroke: s.color } }));
          const showMarkers = s.markers !== false && s.points.length <= 40;
          s.points.forEach((p) => {
            if (!finite(p.y)) return;
            const hollow = p.hollow || (spec.y.log && floor !== undefined && p.y < floor);
            if (showMarkers || hollow) {
              sg.appendChild(S('circle', { class: `rc-dot${hollow ? ' rc-hollow' : ''}`, cx: X(p.x), cy: Y(yv(p.y)), r: hollow ? 3.6 : 3.4, style: { '--c': s.color } }));
            }
          });
          const last = [...s.points].reverse().find((p) => finite(p.y));
          if (last) markers.push({ s, x: X(last.x), y: Y(yv(last.y)) });
        }
        // direct end labels (dropped when they would have to move too far)
        if (endLabels) {
          markers.sort((a, b) => a.y - b.y);
          const placed = [];
          for (const m of markers) {
            let y = m.y;
            const prev = placed[placed.length - 1];
            if (prev && y < prev.y + 14) y = prev.y + 14;
            if (Math.abs(y - m.y) > 20 || y > y1 + 6) continue;
            placed.push({ ...m, y });
          }
          for (const m of placed) {
            const lx = Math.min(m.x + 8, x1 + 8);
            const lg = S('g', { class: 'rc-endlabel', 'data-k': m.s.key });
            lg.appendChild(S('line', { class: 'rc-endkey', x1: lx, x2: lx + 8, y1: m.y, y2: m.y, style: { stroke: m.s.color } }));
            lg.appendChild(S('text', { class: 'rc-label', x: lx + 12, y: m.y, 'dominant-baseline': 'central', text: m.s.label }));
            svg.appendChild(lg);
          }
        }
        // hover: one target per distinct x
        const ux = [...new Set(xs)].sort((a, b) => a - b);
        const xfmt = spec.x.tipFmt || xAxis.fmt;
        const yt = spec.y.tipFmt || yfmt;
        for (const xv of ux) {
          const rows = [], dots = [];
          let ys2 = 0, n = 0;
          for (const s of series) {
            const p = s.points.find((q) => q.x === xv && finite(q.y));
            if (!p) continue;
            const yy = Y(yv(p.y));
            dots.push({ x: X(xv), y: yy, color: s.color });
            ys2 += yy; n++;
            let val = yt(p.y);
            if (s.band && finite(p.lo) && finite(p.hi) && spec.bandInTip !== false && Math.abs(p.hi - p.lo) > 1e-9 * Math.abs(p.hi)) val += `  (${yt(p.lo)}–${yt(p.hi)})`;
            rows.push([s.color, s.label, p.tip || val, s.dash ? 'dash' : 'line']);
          }
          if (!rows.length) continue;
          if (spec.extraRows) rows.push(...spec.extraRows(xv));
          ctx.add({ kind: 'x', x: X(xv), y0, y1, px0: x0, px1: x1, ax: X(xv), ay: ys2 / n, dots,
            tip: { head: spec.head ? spec.head(xv) : xfmt(xv), sub: spec.sub ? spec.sub(xv) : null, rows } });
        }
      },
    });
  };

  /* ================================================================ hbars */
  /**
   * spec: {rows: [{key, label, swatch, segments: [{v, color}], total, valueText, note, muted, best, tip}],
   *        x: {log, label, fmt, min}, rowH, aria}
   */
  RC.hbars = function (host, spec) {
    const rowH = spec.rowH || 18, gap = spec.gap || 14;
    const n = spec.rows.length;
    const top = spec.x && spec.x.label ? 10 : 6;
    return RC.mount(host, {
      height: () => top + n * (rowH + gap) + 34,
      aria: spec.aria,
      draw(ctx) {
        const { svg, w, h } = ctx;
        const labels = spec.rows.map((r) => r.label);
        const lw = Math.min(ctx.narrow ? 112 : 240, maxW(labels, 12, 600) + 24);
        const vt = (r) => (ctx.narrow && r.valueShort ? r.valueShort : r.valueText);
        const vw = Math.max(64, maxW(spec.rows.map((r) => vt(r) || ''), 12, 700) + (spec.rows.some((r) => r.best) ? 26 : 12));
        const x0 = lw + 8, x1 = w - vw - 8;
        const totals = spec.rows.map((r) => r.total).filter(finite);
        let lo = spec.x.log ? Math.min(...totals.filter((v) => v > 0)) : 0;
        let hi = totals.length ? Math.max(...totals) : 1;
        if (spec.x.log && !(lo > 0)) lo = 1;
        const ax = makeAxis({ ...spec.x, zero: !spec.x.log }, lo, Math.max(hi, spec.x.log ? lo * 10 : 1e-9), x0, x1, Math.max(2, Math.floor((x1 - x0) / 90)));
        const X = ax.scale;
        const g = S('g', { class: 'rc-axes' });
        svg.appendChild(g);
        const yEnd = top + n * (rowH + gap);
        const fmt = ax.fmt;
        for (const v of ax.ticks) {
          const x = Math.round(X(v)) + 0.5;
          g.appendChild(S('line', { class: 'rc-grid', x1: x, x2: x, y1: top, y2: yEnd }));
        }
        ticksX(g, ax.ticks, X, yEnd, fmt, false, top);
        titleX(g, spec.x.label, x1, h - 3);
        const base = spec.x.log ? X(ax.lo) : X(0);
        spec.rows.forEach((r, i) => {
          const y = top + i * (rowH + gap) + gap / 2;
          const rg = S('g', { class: `rc-row${r.muted ? ' rc-muted' : ''}` });
          svg.appendChild(rg);
          rg.appendChild(S('rect', { class: 'rc-rowbg', x: 0, y: y - gap / 2 + 2, width: w, height: rowH + gap - 4, rx: 8 }));
          // label with a colour key
          if (r.swatch) rg.appendChild(S('rect', { class: 'rc-swatch', x: 2, y: y + rowH / 2 - 5, width: 10, height: 10, rx: 3, style: { fill: r.swatch } }));
          let label = r.label;
          while (label.length > 3 && textW(label, 12, 600) > lw - 22) label = label.slice(0, -2);
          if (label !== r.label) label = label.replace(/\s+$/, '') + '…';
          rg.appendChild(S('text', { class: 'rc-rowlabel', x: r.swatch ? 18 : 2, y: y + rowH / 2, 'dominant-baseline': 'central', text: label }));
          // stacked segments with 2-px surface gaps
          let acc = spec.x.log ? ax.lo : 0;
          const segs = (r.segments || []).filter((s) => finite(s.v) && s.v > 0);
          const bars = S('g', { class: 'rc-bars' });
          rg.appendChild(bars);
          let xa = base;
          segs.forEach((s, k) => {
            const end = spec.x.log ? s.v : acc + s.v;
            const xb = X(end);
            const last = k === segs.length - 1;
            const xs = k ? xa + 1 : xa, xe = last ? xb : xb - 1;
            if (xe - xs > 0.3) {
              bars.appendChild(S('path', { class: 'rc-bar', d: last ? barPath(xs, y, xe - xs, rowH, 'h') : `M${xs},${y}h${xe - xs}v${rowH}h${-(xe - xs)}Z`, style: { fill: s.color } }));
            }
            acc = end;
            xa = xb;
          });
          if (r.note && !segs.length) {
            rg.appendChild(S('text', { class: 'rc-note', x: base + 4, y: y + rowH / 2, 'dominant-baseline': 'central', text: r.note }));
          }
          if (vt(r)) {
            const vx = (segs.length ? xa : base + (r.note ? textW(r.note, 11.5, 650) + 10 : 0)) + 8;
            const t = S('text', { class: 'rc-value', x: vx, y: y + rowH / 2, 'dominant-baseline': 'central', text: vt(r) });
            rg.appendChild(t);
            if (r.best) {
              const bx = vx + textW(vt(r), 12, 700) + 6;
              rg.appendChild(S('path', { class: 'rc-star', d: star(bx + 5, y + rowH / 2, 5.2) }));
            }
          }
          const target = { kind: 'rect', x: 0, y: y - gap / 2 + 1, w, h: rowH + gap - 2, ax: Math.min(w - 40, Math.max(x0, xa)), ay: y + rowH / 2, tip: r.tip, el: rg };
          ctx.add(target);
        });
        baseline(g, x0, x1, yEnd);
        g.appendChild(S('line', { class: 'rc-axis', x1: Math.round(base) + 0.5, x2: Math.round(base) + 0.5, y1: top, y2: yEnd }));
      },
    });
  };

  function star(cx, cy, r) {
    let d = '';
    for (let k = 0; k < 10; k++) {
      const rr = k % 2 ? r * 0.45 : r;
      const a = -Math.PI / 2 + k * Math.PI / 5;
      d += `${k ? 'L' : 'M'}${(cx + rr * Math.cos(a)).toFixed(2)},${(cy + rr * Math.sin(a)).toFixed(2)}`;
    }
    return d + 'Z';
  }

  /* ============================================================== columns */
  /**
   * spec: {categories: [{key, label}], series: [{key, label, color}],
   *        value: (catKey, serKey) => {v, tip} | null, y: {label, fmt}, head: (cat) => string}
   */
  RC.columns = function (host, spec) {
    return RC.mount(host, {
      height: spec.height || ((w) => (w < 520 ? 240 : 280)),
      aria: spec.aria,
      draw(ctx) {
        const { svg, w, h } = ctx;
        const cats = spec.categories, sers = spec.series;
        const vals = [];
        for (const c of cats) for (const s of sers) { const q = spec.value(c.key, s.key); if (q && finite(q.v)) vals.push(q.v); }
        if (!vals.length) return;
        const top = 30, bottom = 40, y1 = h - bottom, y0 = top;
        const ax = makeAxis({ ...spec.y, zero: true }, Math.min(0, ...vals), Math.max(0, ...vals), y1, y0, Math.max(3, Math.floor((y1 - y0) / 44)));
        const Y = ax.scale;
        const fmt = ax.fmt;
        const x0 = Math.max(30, maxW(ax.ticks.map(fmt)) + 14), x1 = w - 12;
        const g = S('g', { class: 'rc-axes' });
        svg.appendChild(g);
        gridY(g, ax.ticks, Y, x0, x1, fmt);
        titleY(g, spec.y.label, 2, 13);
        titleX(g, spec.x && spec.x.label, x1, h - 4);
        const slot = (x1 - x0) / cats.length;
        const bw = Math.max(3, Math.min(24, (slot * 0.72 - (sers.length - 1) * 2) / sers.length));
        const groupW = bw * sers.length + (sers.length - 1) * 2;
        const zy = Y(0);
        let lastLabel = -Infinity;
        cats.forEach((c, ci) => {
          const cx = x0 + slot * (ci + 0.5);
          const lab = c.label;
          const tw = textW(lab);
          if (cx - tw / 2 > lastLabel + 4) {
            g.appendChild(S('text', { class: 'rc-tick', x: cx, y: y1 + 17, 'text-anchor': 'middle', text: lab }));
            lastLabel = cx + tw / 2;
          }
          const cg = S('g', { class: 'rc-col' });
          svg.appendChild(cg);
          cg.appendChild(S('rect', { class: 'rc-rowbg', x: cx - slot / 2 + 2, y: y0 - 6, width: slot - 4, height: y1 - y0 + 6, rx: 8 }));
          const rows = [];
          sers.forEach((s, si) => {
            const q = spec.value(c.key, s.key);
            if (!q || !finite(q.v)) return;
            const bx = cx - groupW / 2 + si * (bw + 2);
            const yv = Y(q.v);
            const up = q.v >= 0;
            const hh = Math.abs(zy - yv);
            if (hh > 0.2) cg.appendChild(S('path', { class: 'rc-bar rc-vbar', d: barPath(bx, up ? yv : zy, bw, hh, up ? 'up' : 'down', Math.min(4, bw / 2)), style: { fill: s.color } }));
            else cg.appendChild(S('line', { class: 'rc-zero-mark', x1: bx, x2: bx + bw, y1: zy, y2: zy, style: { stroke: s.color } }));
            rows.push([s.color, s.label, q.tip || fmt(q.v), 'rect']);
          });
          ctx.add({ kind: 'rect', x: cx - slot / 2, y: y0, w: slot, h: y1 - y0, ax: cx + groupW / 2, ay: (y0 + y1) / 2, el: cg,
            tip: { head: spec.head ? spec.head(c) : c.label, rows } });
        });
        g.appendChild(S('line', { class: 'rc-axis rc-zero', x1: x0, x2: x1, y1: Math.round(zy) + 0.5, y2: Math.round(zy) + 0.5 }));
      },
    });
  };

  /* ================================================================ boxes */
  /** spec: {groups: [{key, label, color, stats, points: [{y, tip}], note}], y: {label, fmt, tipFmt}} */
  RC.boxes = function (host, spec) {
    return RC.mount(host, {
      height: spec.height || ((w) => (w < 520 ? 300 : 340)),
      aria: spec.aria,
      draw(ctx) {
        const { svg, w, h } = ctx;
        const groups = spec.groups;
        const ys = [];
        for (const gr of groups) for (const p of gr.points) if (finite(p.y)) ys.push(p.y);
        if (!ys.length) return;
        const top = 30, bottom = 54, y1 = h - bottom, y0 = top;
        const ax = makeAxis({ ...spec.y, zero: true }, Math.min(0, ...ys), Math.max(...ys), y1, y0, Math.max(3, Math.floor((y1 - y0) / 44)));
        const Y = ax.scale;
        const fmt = ax.fmt;
        const tfmt = spec.y.tipFmt || fmt;
        const x0 = Math.max(30, maxW(ax.ticks.map(fmt)) + 14), x1 = w - 10;
        const g = S('g', { class: 'rc-axes' });
        svg.appendChild(g);
        gridY(g, ax.ticks, Y, x0, x1, fmt);
        titleY(g, spec.y.label, 2, 13);
        const slot = (x1 - x0) / groups.length;
        const bw = Math.max(18, Math.min(64, slot * 0.4));
        groups.forEach((gr, gi) => {
          const cx = x0 + slot * (gi + 0.5);
          const st = gr.stats || {};
          const bg = S('g', { class: 'rc-boxg', 'data-k': gr.key });
          svg.appendChild(bg);
          // group label and note under the axis (compact when the slot is narrow)
          const roomy = textW(gr.label, 12, 650) + 22 <= slot - 6;
          let label = gr.label;
          while (!roomy && label.length > 3 && textW(label, 11, 650) > slot - 8) label = label.slice(0, -2);
          if (label !== gr.label) label = label.replace(/\s+$/, '') + '…';
          if (roomy) g.appendChild(S('rect', { class: 'rc-swatch', x: cx - textW(gr.label, 12, 650) / 2 - 15, y: y1 + 11, width: 10, height: 10, rx: 3, style: { fill: gr.color } }));
          g.appendChild(S('text', { class: `rc-rowlabel${roomy ? '' : ' rc-small'}`, x: roomy ? cx + 7 : cx, y: y1 + 16.5, 'text-anchor': 'middle', 'dominant-baseline': 'central', text: label }));
          const note = gr.note && textW(gr.note, 10.5) <= slot - 4 ? gr.note : gr.shortNote;
          if (note) g.appendChild(S('text', { class: 'rc-subtick', x: cx, y: y1 + 34, 'text-anchor': 'middle', text: note }));
          if (st.n) {
            const wl = Y(st.whisker_lo), wh = Y(st.whisker_hi), q1 = Y(st.q1), q3 = Y(st.q3), md = Y(st.median);
            bg.appendChild(S('line', { class: 'rc-whisker', x1: cx, x2: cx, y1: wl, y2: q1, style: { stroke: gr.color } }));
            bg.appendChild(S('line', { class: 'rc-whisker', x1: cx, x2: cx, y1: q3, y2: wh, style: { stroke: gr.color } }));
            bg.appendChild(S('line', { class: 'rc-whisker', x1: cx - bw * 0.22, x2: cx + bw * 0.22, y1: wl, y2: wl, style: { stroke: gr.color } }));
            bg.appendChild(S('line', { class: 'rc-whisker', x1: cx - bw * 0.22, x2: cx + bw * 0.22, y1: wh, y2: wh, style: { stroke: gr.color } }));
            bg.appendChild(S('rect', { class: 'rc-box', x: cx - bw / 2, y: q3, width: bw, height: Math.max(1.5, q1 - q3), rx: 5, style: { '--c': gr.color } }));
            bg.appendChild(S('line', { class: 'rc-median', x1: cx - bw / 2 + 1, x2: cx + bw / 2 - 1, y1: md, y2: md }));
            const my = Y(st.mean);
            bg.appendChild(S('path', { class: 'rc-mean', d: `M${cx},${my - 4.5}L${cx + 4.5},${my}L${cx},${my + 4.5}L${cx - 4.5},${my}Z` }));
            ctx.add({ kind: 'rect', x: cx - bw / 2 - 4, y: Math.min(wh, q3) - 2, w: bw + 8, h: Math.max(wl, q1) - Math.min(wh, q3) + 4, ax: cx + bw / 2, ay: md, el: bg,
              tip: { head: gr.label, rows: [
                [gr.color, I.t('median'), tfmt(st.median), 'rect'],
                [gr.color, I.t('mean'), tfmt(st.mean), 'rect'],
                [gr.color, I.t('quartiles'), `${tfmt(st.q1)} – ${tfmt(st.q3)}`, 'rect'],
                [gr.color, I.t('max'), tfmt(st.max), 'rect'],
                [null, 'n', I.num(st.n, 0)],
              ] } });
          }
          // the observations, jittered deterministically inside the box width
          const pts = gr.points.filter((p) => finite(p.y));
          pts.forEach((p, k) => {
            const j = (((k * 2654435761) >>> 0) % 1000) / 1000 - 0.5;
            const px = cx + j * bw * 0.8, py = Y(p.y);
            const c = S('circle', { class: 'rc-obs', cx: px, cy: py, r: pts.length > 80 ? 2.4 : 3.1, style: { '--c': gr.color } });
            bg.appendChild(c);
            ctx.add({ kind: 'pt', x: px, y: py, r: 3, tip: p.tip, el: c });
          });
        });
        baseline(g, x0, x1, Y(0));
      },
    });
  };

  /* ============================================================== scatter */
  /**
   * spec: {points: [{x, y, s, tip, key}], color, line: 'stair'|'poly',
   *        sizeDomain: [lo, hi], refs: [{x, y, label, color, tip}],
   *        notes: [{i, text}], x: {label, fmt}, y: {label, fmt}}
   */
  RC.scatter = function (host, spec) {
    return RC.mount(host, {
